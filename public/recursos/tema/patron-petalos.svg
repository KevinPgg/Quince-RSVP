<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!--
    Mosaico de pétalos y destellos que se repite detrás de toda la página.
    Es SVG y no una foto a propósito: pesa 2 KB, cubre cualquier alto de
    scroll sin estirar nada y se ve nítido en cualquier pantalla.
    Nada toca los bordes del mosaico, así que no hay costuras al repetir.
    Los colores van claros porque encima llevan opacidad baja.
  -->
  <defs>
    <path id="p" d="M13 0C21.5 8.5 21.5 21.5 13 30 4.5 21.5 4.5 8.5 13 0Z"/>
    <path id="d" d="M8 0 9.6 6.4 16 8 9.6 9.6 8 16 6.4 9.6 0 8 6.4 6.4Z"/>
  </defs>

  <g fill="#c9a8e0">
    <use href="#p" x="28"  y="24"  transform="rotate(18 40 38)"/>
    <use href="#p" x="176" y="16"  transform="rotate(-34 188 30)"/>
    <use href="#p" x="96"  y="92"  transform="rotate(62 108 106)"/>
    <use href="#p" x="212" y="118" transform="rotate(9 224 132)"/>
    <use href="#p" x="16"  y="154" transform="rotate(-52 28 168)"/>
    <use href="#p" x="140" y="196" transform="rotate(28 152 210)"/>
    <use href="#p" x="66"  y="216" transform="rotate(-14 78 230)"/>
    <use href="#p" x="120" y="140" transform="rotate(-70 137 160)"/>
    <use href="#p" x="228" y="60"  transform="rotate(40 245 80)"/>
    <use href="#p" x="0"   y="98"  transform="rotate(75 17 118)"/>
  </g>

  <g fill="#d9c08a">
    <use href="#d" x="122" y="42"  transform="scale(0.62) translate(75 26)"/>
    <use href="#d" x="52"  y="128" transform="scale(0.5)  translate(52 128)"/>
    <use href="#d" x="196" y="172" transform="scale(0.7)  translate(84 74)"/>
    <use href="#d" x="8"   y="72"  transform="scale(0.45) translate(10 88)"/>
  </g>
</svg>
